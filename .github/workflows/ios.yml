name: Build and screenshot

# Builds RaceMe on a macOS runner and uploads a screenshot of every screen as an
# artifact. This is how the app gets looked at from a machine that can't run
# Xcode.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The race simulator is pure Foundation, so it compiles and runs on Linux in
  # about a minute — no Mac, no simulator, no waiting. It races thousands of
  # times and asserts the properties the product depends on: close finishes,
  # leads that genuinely trade, realistic splits, a late kick, and handicap
  # racing that a slower runner can actually win.
  #
  # This job caught handicap racing being decided by archetype draw rather than
  # by effort. Keep it first — if the physics is wrong, the UI doesn't matter.
  simulator:
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Build the validation harness
        run: |
          swiftc -O \
            RaceMe/Simulation/Rng.swift \
            RaceMe/Model/Archetype.swift \
            RaceMe/Simulation/PaceSpread.swift \
            RaceMe/Simulation/GhostRunner.swift \
            Validation/main.swift \
            -o validate

      - name: Race it ten thousand times
        run: ./validate

  build:
    needs: simulator
    # RaceMe needs the iOS 26 SDK, which means Xcode 26.
    # If this image doesn't exist yet on your account, the job fails instantly
    # with "no runner matching labels" — change this one line to macos-15 and
    # check the "Show available Xcode versions" step to see what you've got.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # RaceMe targets the iOS 26 SDK, which needs Xcode 26. Print what the
      # runner actually has before doing anything, so a toolchain mismatch is
      # obvious in the log instead of showing up as a wall of API errors.
      - name: Show available Xcode versions
        run: |
          ls /Applications | grep -i '^Xcode' || true
          xcodebuild -version

      - name: Select the newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Show available simulators
        run: xcrun simctl list devices available

      # Proves the project parses and the shared scheme is visible. If this step
      # fails, the problem is the project file — not the Swift.
      - name: Show project targets and schemes
        run: xcodebuild -project RaceMe.xcodeproj -list

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project RaceMe.xcodeproj \
            -scheme RaceMe \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
        continue-on-error: true

      # Compiler errors, pulled out of a very long log and dropped into the run
      # summary — which is readable without downloading anything.
      - name: Summarise compiler errors
        if: always()
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -E 'error:|warning: .*deprecat' build.log | head -80 || echo "(none found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Fail the job for real if anything errored.
          if grep -q 'error:' build.log; then
            echo "Build had errors."
            grep -E 'error:' build.log | head -60
            exit 1
          fi

      - name: Screenshot every screen
        run: |
          chmod +x Scripts/screenshots.sh
          # Fall back to whatever iPhone the runner actually has.
          DEVICE=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+ Pro' | tail -1)
          DEVICE=${DEVICE:-iPhone 16 Pro}
          echo "Using $DEVICE"
          ./Scripts/screenshots.sh "$DEVICE"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raceme-screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/Logs/
          if-no-files-found: ignore

  # Produces an UNSIGNED .ipa — the app itself, with no Apple signature on it.
  #
  # On its own it will not install on a phone. You sign it afterwards with a
  # free Apple ID using Sideloadly or AltStore on Windows, which is the only way
  # to get this onto an iPhone without ever touching a Mac. See README.
  unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Build for device, unsigned
        run: |
          set -o pipefail
          xcodebuild \
            -project RaceMe.xcodeproj \
            -scheme RaceMe \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Wrap it into an .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RaceMe.app Payload/
          zip -qry RaceMe-unsigned.ipa Payload
          ls -lh RaceMe-unsigned.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: RaceMe-unsigned-ipa
          path: RaceMe-unsigned.ipa
